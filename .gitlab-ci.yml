# 构建 Relay 控制面镜像并推到内部 registry。
# 形状对齐 edumind/edumindx：buildkit 远程构建，main/master/release 出正式版，
# 其余分支出 dev 版。
#
# 与 edumindx 的区别：fmt / clippy / test 跑在 Dockerfile.ci 的 builder 阶段里，
# 没有单独的 check job——集群 runner 侧没有 rust 基础镜像，而 buildkit 配了
# docker.io 镜像源可以直接拉 rust:bookworm。检查不过镜像就构建不出来。
default:
  image: hub.edumind.ai/infra/gitlab/infra/buildkit:v0.17.1
  retry: 1
  tags:
    - gpu-resource
  before_script:
    - mkdir -p ~/.docker
    - cat /etc/ssl/edumind/ca.crt >> /etc/ssl/certs/ca-certificates.crt
    - |
      if [ -z "${REGISTRY_PAT:-}" ]; then
        echo "Missing REGISTRY_PAT (project CI variable)" >&2
        exit 1
      fi
      # 这里不能用 CI_JOB_TOKEN。运行时镜像基于 debian:bookworm-slim，与
      # agent/multimodal_agent/dev 共享层；推送时 buildkit 会请求从那个仓库
      # 跨仓库挂载已有 blob，于是把它的 pull scope 一并塞进令牌请求：
      #   [auth] agent/multimodal_agent/dev:pull platform/relay/main:pull,push
      # job token 只对本项目有权，整个请求拿不到 push，registry 返回
      # insufficient_scope。用带 read_registry 的 PAT 才能覆盖到源仓库。
      REGISTRY_AUTH=$(printf '%s:%s' 'QeuryEnd' "${REGISTRY_PAT}" | base64 | tr -d '\n')
      HUB_AUTH=$(printf '%s' "ci:${HUB_TOKEN}" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"${REGISTRY_AUTH}\"},\"hub.edumind.ai\":{\"auth\":\"${HUB_AUTH}\"}}}" > ~/.docker/config.json

stages:
  - check
  - build

# 部署脚本是 POSIX sh，语法错误在 CI 里拦下来比在服务器上发现便宜得多。
# 这个 job 不碰 registry，也不需要 buildkit。
deploy-scripts:
  stage: check
  image: hub.edumind.ai/infra/gitlab/infra/images/node:22-alpine
  before_script: []
  script:
    - sh -n deploy/install.sh
    - sh -n deploy/manage.sh

.build: &build
  stage: build
  script:
    - buildctl --addr=tcp://buildkit-service.buildkit-service-system:1234 build
      --frontend dockerfile.v0 --opt platform=linux/amd64
      --opt filename=Dockerfile.ci
      ${OUTPUTS}
      --import-cache type=registry,ref=${CACHE}
      --export-cache type=registry,ref=${CACHE}
      --progress=plain
      --local context=.
      --local dockerfile=.
      --opt build-arg:OCI_REVISION=${CI_COMMIT_SHA}
      --opt build-arg:OCI_SOURCE=${CI_PROJECT_URL}

build_production:
  <<: *build
  variables:
    OUTPUTS: >-
      --output type=image,name=${VERSION_IMAGE},push=true
      --output type=image,name=${LATEST_IMAGE},push=true
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\[skip\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release"'
      when: always
    - when: never

build_dev:
  <<: *build
  variables:
    OUTPUTS: --output type=image,name=${DEV_IMAGE},push=true
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\[skip\]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "release"'
      when: never
    - when: always

# Remote Worker 的沙箱 Runtime 镜像。它不随控制面每次提交变化，
# 只在 Dockerfile 或钉住的 CLI 版本改动时才需要重建。
build_agent_runtime:
  stage: build
  script:
    - buildctl --addr=tcp://buildkit-service.buildkit-service-system:1234 build
      --frontend dockerfile.v0 --opt platform=linux/amd64
      --opt filename=docker/agent-runtime/Dockerfile
      --output type=image,name=${RUNTIME_IMAGE},push=true
      --import-cache type=registry,ref=${RUNTIME_CACHE}
      --export-cache type=registry,ref=${RUNTIME_CACHE}
      --progress=plain
      --local context=.
      --local dockerfile=.
  # 只手动触发。原来带 changes 规则，但 web/api 触发的流水线没有 diff 基准，
  # changes 会判定为「变了」而每次都跑，跟 build_production 抢同一个 buildkit
  # 守护进程，导致 auth session 混在一起、推镜像被拒。
  # 这个镜像只在 Remote Worker 沙箱要用，不随控制面每次提交变化。
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /^\[skip\]/'
      when: never
    - when: manual
      allow_failure: true

variables:
  VERSION: 1.0.${CI_PIPELINE_IID}
  IMAGE: hub.edumind.ai/infra/gitlab/${CI_PROJECT_PATH}
  VERSION_IMAGE: ${IMAGE}/${CI_COMMIT_BRANCH}:${VERSION}
  LATEST_IMAGE: ${IMAGE}/${CI_COMMIT_BRANCH}:latest
  DEV_IMAGE: ${IMAGE}/dev:${VERSION}
  CACHE: hub.edumind.ai/infra/gitlab/${CI_PROJECT_PATH}:cache
  RUNTIME_IMAGE: ${IMAGE}/agent-runtime:${VERSION}
  RUNTIME_CACHE: ${IMAGE}/agent-runtime:cache
