name: relay

services:
  postgres:
    image: postgres:18-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  relay:
    image: ${RELAY_IMAGE:-relay:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RELAY_DATABASE_URL_FILE: /run/secrets/relay-database-url
    secrets:
      - relay-database-url
    command:
      - serve
      - --bind
      - 0.0.0.0:7777
      - --allow-insecure-public-http
    ports:
      - 127.0.0.1:${RELAY_PORT:-7777}:7777
    volumes:
      - relay-data:/var/lib/relay
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  caddy:
    image: caddy:2-alpine
    profiles: ["hosted"]
    restart: unless-stopped
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:-localhost}
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  relay-data:
  caddy-data:
  caddy-config:

secrets:
  relay-database-url:
    file: ${RELAY_DATABASE_URL_SECRET_FILE:-./deploy/secrets/database-url}
